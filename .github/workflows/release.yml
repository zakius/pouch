name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Back-to-back merges must release one at a time, each bumping from the previous release's version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run format:check
      - run: bun test

      - name: Build and sign extension
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: bun run release:sign

      - name: Read bumped version
        if: always()
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - run: bun run format
        if: always()

      - name: Commit version bump
        if: always() && steps.version.outputs.version != ''
        run: |
          if git diff --quiet package.json src/manifest.json; then
            echo "No version bump to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/manifest.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}" --force
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}" --force

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/signed/*.xpi \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
