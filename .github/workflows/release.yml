name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Back-to-back merges must release one at a time, each bumping from the previous release's version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Both jobs check out main, so both bump from the same released version.
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the Chromium packages
        run: bun run build.ts --bump --chromium
      - uses: actions/upload-artifact@v4
        with:
          name: chromium
          path: dist/packages/*-chromium-*.zip
          if-no-files-found: error

  firefox:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run format:check
      - run: bun test --isolate

      - name: Build and sign extension
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: bun run release:sign

      - name: Read bumped version
        if: always()
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - run: bun run format
        if: always()

      - name: Commit version bump
        if: always() && steps.version.outputs.version != ''
        run: |
          if git diff --quiet package.json src/manifest.json; then
            echo "No version bump to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/manifest.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}" --force
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}" --force

      - uses: actions/upload-artifact@v4
        with:
          name: firefox
          path: dist/signed/*.xpi
          if-no-files-found: error

  publish:
    needs: [firefox, chromium]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ needs.firefox.outputs.version }}" \
            artifacts/*.xpi \
            artifacts/*-chromium-*.zip \
            --title "v${{ needs.firefox.outputs.version }}" \
            --generate-notes
