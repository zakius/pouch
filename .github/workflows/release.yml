name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Back-to-back merges must release one at a time, each bumping from the previous release's version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Both jobs check out main, so both bump from the same released version.
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the Chromium packages
        run: bun run build.ts --bump --chromium
      # Each key is the one behind its manifest's `key`, so each crx keeps its ID.
      # Each update XML is what that manifest's update_url fetches from the latest release.
      - name: Pack Pouch and Quick Actions as signed crx files
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          CRX_QUICK_PRIVATE_KEY: ${{ secrets.CRX_QUICK_PRIVATE_KEY }}
        run: |
          version=$(jq -r .version package.json)
          key="$RUNNER_TEMP/key.pem"
          # pack <private key> <unpacked dir> <package name> <update XML>
          pack() {
            [ -n "$1" ] || { echo "Missing a CRX signing key secret" >&2; exit 1; }
            crx="$3-chromium-$version.crx"
            (umask 077 && printf '%s\n' "$1" > "$key")
            bunx crx3 -p "$key" -o "dist/packages/$crx" -x "dist/packages/$4" \
              --appVersion "$version" \
              --crxURL "https://github.com/zakius/pouch/releases/download/v$version/$crx" \
              -- "$2"
            rm "$key"
          }
          pack "$CRX_PRIVATE_KEY" dist/chromium/pouch pouch updates.xml
          pack "$CRX_QUICK_PRIVATE_KEY" dist/chromium/quick-actions pouch-quick-actions updates-quick.xml
      - uses: actions/upload-artifact@v4
        with:
          name: chromium
          path: |
            dist/packages/*-chromium-*.zip
            dist/packages/*-chromium-*.crx
            dist/packages/updates*.xml
          if-no-files-found: error

  firefox:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run format:check
      - run: bun test --isolate

      - name: Build and sign extension
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: bun run release:sign

      - name: Read bumped version
        if: always()
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - run: bun run format
        if: always()

      - name: Commit version bump
        if: always() && steps.version.outputs.version != ''
        run: |
          if git diff --quiet package.json src/manifest.json; then
            echo "No version bump to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/manifest.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}" --force
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}" --force

      - uses: actions/upload-artifact@v4
        with:
          name: firefox
          path: dist/signed/*.xpi
          if-no-files-found: error

  publish:
    needs: [firefox, chromium]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ needs.firefox.outputs.version }}" \
            artifacts/*.xpi \
            artifacts/*-chromium-*.zip \
            artifacts/*-chromium-*.crx \
            artifacts/updates.xml \
            artifacts/updates-quick.xml \
            --title "v${{ needs.firefox.outputs.version }}" \
            --generate-notes
