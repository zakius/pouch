<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
    />
    <title>Pouch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="search-container">
      <button id="settings-button" class="settings-button" title="Settings" aria-label="Settings">
        &#x2699;
      </button>
      <input type="text" id="search" placeholder="Search articles..." autocomplete="off" />
      <button
        id="save-page-button"
        class="save-page-button"
        title="Save current page"
        aria-label="Save current page"
        aria-pressed="false"
      >
        +
      </button>
    </div>
    <div id="article-list" class="article-list">
      <div id="empty-message" class="empty-state" role="status" style="display: none">
        No articles yet. Save the page you're on with the + button, or
        <a href="#" class="settings-link">connect a hosted service in Settings</a> to see articles
        you've already saved.
      </div>
      <div id="no-results-message" class="empty-state" role="status" style="display: none">
        No articles found for your search.
      </div>
      <div id="articles" class="articles-container"></div>
    </div>
    <div class="pagination">
      <button id="prev-page" class="pagination-button" aria-label="Previous page" disabled>
        ←
      </button>
      <select id="page-select" class="page-select" aria-label="Page number"></select>
      <span id="page-info">of 1</span>
      <button id="next-page" class="pagination-button" aria-label="Next page">→</button>
    </div>
    <div id="sr-live" class="visually-hidden" role="status" aria-live="polite"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
