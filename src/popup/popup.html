<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pouch</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="search-container">
        <button id="settings-button" class="settings-button" title="Settings">&#x2699;</button>
        <input type="text" id="search" placeholder="Search articles..." autocomplete="off">
        <button id="save-page-button" class="save-page-button" title="Save current page">+</button>
    </div>
    <div id="article-list" class="article-list">
        <div id="empty-message" class="empty-state" style="display: none;">You have no saved articles.</div>
        <div id="no-results-message" class="empty-state" style="display: none;">No articles found for your
            search.</div>
        <div id="articles" class="articles-container"></div>
    </div>
    <div class="pagination">
        <button id="prev-page" class="pagination-button" disabled>←</button>
        <select id="page-select" class="page-select"></select>
        <span id="page-info">of 1</span>
        <button id="next-page" class="pagination-button">→</button>
    </div>
    <script type="module" src="popup.js"></script>
</body>

</html>
